name: KONTROL audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit Dockerfiles
        id: kontrol
        # External repositories: uses: mayurbagade456/kontrol@main
        uses: ./
        with:
          path: Dockerfile
          format: sarif
          output: kontrol.sarif
          fail-on: high
          min-score: 70

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kontrol.sarif

      - name: Print result
        if: always()
        run: echo "Score ${{ steps.kontrol.outputs.score }} (grade ${{ steps.kontrol.outputs.grade }})"
